{% extends "base.html" %}
{% block content %}

<div class="auth-card">
  <h1>My Credentials</h1>
  <p>Manage your Lavonne Gas account information.</p>

  <form method="post">
    <label>Full Name</label>
    <input type="text" name="name" value="{{ customer['name'] }}" required>

    <label>Phone Number</label>
    <input type="tel" name="phone" value="{{ customer['phone'] }}" required>

    <label>Delivery Address</label>
    <input type="text" name="address" value="{{ customer['address'] or '' }}">

    <button type="submit" class="button">Save Changes</button>
  </form>

  <p class="auth-link">
    <a href="{{ url_for('customer_dashboard') }}">Back to Account</a>
  </p>
</div>

{% endblock %}
