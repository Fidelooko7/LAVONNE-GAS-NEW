{% extends "base.html" %}
{% block content %}
<div class="auth-card">
  <h1>Create Customer Account</h1>
  <p>Register with your phone number to manage your Lavonne Gas orders and account.</p>

  <form method="post">
    <label>Full Name</label>
    <input type="text" name="name" required>

    <label>Phone Number</label>
    <input type="tel" name="phone" required placeholder="07XXXXXXXX">

    <label>Address</label>
    <input type="text" name="address" placeholder="Delivery address">

    <label>Password</label>
    <input type="password" name="password" required minlength="8">

    <label>Confirm Password</label>
    <input type="password" name="confirm_password" required minlength="8">

    <button type="submit" class="button">Create Account</button>
  </form>

  <p class="auth-link">
    Already have an account?
    <a href="{{ url_for('customer_login') }}">Login</a>
  </p>
</div>
{% endblock %}
